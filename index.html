<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pizza AR Menu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        a-scene { width: 100% !important; height: 100% !important; }
        .mindar-ui-overlay { display: none !important; }

        .overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            color: #fff; text-align: center; padding: 20px;
        }
        #start-overlay { background: rgba(0,0,0,0.95); z-index: 300; }
        #loading-overlay { background: rgba(0,0,0,0.8); z-index: 200; display: none; }
        #scanning-overlay { background: rgba(0,0,0,0.2); z-index: 50; display: none; }

        .btn { padding: 14px 32px; background: #ff6b35; color: #fff; border: none; border-radius: 50px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #ff6b35; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #error-msg { color: #ff4444; margin-top: 15px; font-weight: bold; max-width: 350px; }
    </style>
</head>
<body>
    <div id="start-overlay" class="overlay">
        <h1>🍕 Pizza AR Menu</h1>
        <p>Point your camera at the pizza menu image to see the 3D pizza model appear.</p>
        <button id="start-btn" class="btn">Start AR Camera</button>
        <div id="error-msg"></div>
    </div>

    <div id="loading-overlay" class="overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Starting AR camera…</p>
    </div>

    <div id="scanning-overlay" class="overlay">
        <h2>Scanning…</h2>
        <p>Point camera at the pizza menu image</p>
    </div>

    <!-- A-Frame Scene (Notice mindar-image is MISSING here. We add it on click) -->
    <a-scene 
        color-space="sRGB"
        renderer="antialias: true; colorManagement: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        style="width: 100%; height: 100%;">

        <a-assets>
            <a-asset-item id="pizza-model-asset" src="pizza.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity id="model-container" rotation="0 0 0" scale="1 1 1">
                <a-gltf-model id="pizzaModel" src="#pizza-model-asset" position="0 0 0" scale="1 1 1"></a-gltf-model>
            </a-entity>
        </a-entity>
    </a-scene>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const startBtn = document.getElementById('start-btn');
        const startOverlay = document.getElementById('start-overlay');
        const loadingOverlay = document.getElementById('loading-overlay');
        const scanningOverlay = document.getElementById('scanning-overlay');
        const modelContainer = document.getElementById('model-container');
        const errorMsg = document.getElementById('error-msg');

        startBtn.addEventListener('click', () => {
            if (window.location.protocol === 'file:') {
                errorMsg.innerText = 'ERROR: Open via http://localhost:8000';
                return;
            }
            if (!window.isSecureContext) {
                errorMsg.innerText = 'ERROR: Must use HTTPS or localhost';
                return;
            }

            startOverlay.style.display = 'none';
            loadingOverlay.style.display = 'flex';

            // KEY FIX: Inject the mindar-image attribute here.
            // This forces MindAR to initialize AS a result of your tap, bypassing iOS security blocks.
            sceneEl.setAttribute('mindar-image', 'imageTargetSrc: targets.mind; maxTrack: 4; filterMinCF: 0.0001; filterBeta: 0.01;');
        });

        // Listen for AR Ready
        sceneEl.addEventListener('arReady', () => {
            console.log('AR is ready, camera is streaming!');
            loadingOverlay.style.display = 'none';
            scanningOverlay.style.display = 'flex';
        });

        sceneEl.addEventListener('arError', (event) => {
            console.error('AR Error:', event.detail);
            loadingOverlay.style.display = 'none';
            startOverlay.style.display = 'flex';
            errorMsg.innerText = 'AR Camera Error: ' + (event.detail.error || 'Unknown error');
        });

        const targetEl = document.querySelector('[mindar-image-target]');
        targetEl.addEventListener('targetFound', () => {
            console.log('Target found!');
            scanningOverlay.style.display = 'none';
            
            // Auto-center and scale the model
            const modelEl = document.getElementById('pizzaModel');
            const model = modelEl.getObject3D('mesh');
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                model.traverse((o) => {
                    if (o.isMesh && o.geometry) {
                        o.geometry.translate(-center.x, -center.y, -center.z);
                    }
                });

                const maxDim = Math.max(size.x, size.y, size.z);
                let scale = 1.0;
                if (maxDim > 0) scale = 1.5 / maxDim;
                modelContainer.setAttribute('scale', `${scale} ${scale} ${scale}`);
            }
        });

        targetEl.addEventListener('targetLost', () => {
            scanningOverlay.style.display = 'flex';
        });

        // Touch Controls
        let currentRotation = 0, currentScale = 1.0, baseScale = 1.0, isDragging = false, lastX = 0, lastTouchDist = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                baseScale = currentScale;
            } else if (e.touches.length === 1) {
                isDragging = true; lastX = e.touches[0].clientX;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                currentScale = Math.max(0.1, Math.min(5.0, baseScale + (dist - lastTouchDist) * 0.01));
                modelContainer.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
            } else if (e.touches.length === 1 && isDragging) {
                e.preventDefault();
                currentRotation += (e.touches[0].clientX - lastX) * 0.5;
                modelContainer.setAttribute('rotation', `0 ${currentRotation} 0`);
                lastX = e.touches[0].clientX;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => { isDragging = false; });
    </script>
</body>
</html>
