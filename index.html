<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Restaurant AR Menu</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 16px;
    }

    #simple-text {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      z-index: 100;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 4px;
      min-width: 150px;
    }
  </style>

  <script>
    // ============================================================
    // COMPONENT 1: Pinch to Scale
    // ============================================================
    AFRAME.registerComponent("pinch-scale", {
      init: function () {
        const el = this.el;
        let startDistance = 0;
        let startScale = el.object3D.scale.x;

        const getDistance = (touches) => {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        };

        window.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length !== 2) return;
            e.preventDefault();

            const distance = getDistance(e.touches);

            if (!startDistance) {
              startDistance = distance;
              startScale = el.object3D.scale.x;
              return;
            }

            const scale = startScale * (distance / startDistance);
            const clampedScale = Math.max(0.5, Math.min(scale, 20));

            el.object3D.scale.set(clampedScale, clampedScale, clampedScale);
          },
          { passive: false }
        );

        window.addEventListener("touchend", () => {
          startDistance = 0;
        });
      }
    });

    // ============================================================
    // COMPONENT 2: Drag to Rotate (Free rotation - X and Y axis)
    // ============================================================
    // Horizontal drag -> spin left/right (Y axis)
    // Vertical drag   -> tilt up/down (X axis)
    // Combining both gives full multi-directional rotation control,
    // similar to spinning a globe with your finger.
    AFRAME.registerComponent("drag-rotate", {
      init: function () {
        const el = this.el;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        window.addEventListener("touchstart", (e) => {
          if (e.touches.length === 1) {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          if (e.touches.length !== 1 || !isDragging) return;
          e.preventDefault();

          const currentX = e.touches[0].clientX;
          const currentY = e.touches[0].clientY;
          const deltaX = currentX - lastX;
          const deltaY = currentY - lastY;

          // Horizontal finger movement -> spin around Y axis
          el.object3D.rotation.y += deltaX * 0.01;
          // Vertical finger movement -> tilt around X axis
          // NOTE: sign is inverted (-=) vs. what you'd naively expect,
          // because dragging your finger UP on screen (negative deltaY)
          // should tilt the TOP of the model TOWARD you, matching how
          // trackball/orbit controls conventionally feel. Using += here
          // made it feel backwards.
          el.object3D.rotation.x -= deltaY * 0.01;

          lastX = currentX;
          lastY = currentY;
        }, { passive: false });

        window.addEventListener("touchend", () => {
          isDragging = false;
        });
      }
    });

    // ============================================================
    // COMPONENT 3+4: Stable Tracking (real smoothing + persistence)
    // ============================================================
    // THIS REPLACES TWO PREVIOUSLY BROKEN THINGS:
    //
    // 1. The old "smooth-tracking" component monkey-patched el.setAttribute
    //    to smooth position changes. But MindAR updates object3D.position/
    //    quaternion DIRECTLY every frame - it never calls setAttribute().
    //    So that smoothing code never actually ran, not even once. That's
    //    the real reason the model was still shaking.
    //
    // 2. The old "persist-model" only froze the transform on target-lost,
    //    with no smoothing while actively tracking.
    //
    // Both are merged into one component here to avoid tick-ordering bugs
    // between two separate components fighting over the same object3D.
    //
    // HOW REAL SMOOTHING WORKS:
    // Each frame, MindAR writes a fresh (sometimes noisy/jittery) raw
    // position+rotation into object3D BEFORE our tick() runs (A-Frame
    // runs system-level tracking updates before per-entity component
    // ticks). We read that raw value, blend it with our own remembered
    // "smoothed" value from last frame (exponential moving average), and
    // write the blended result back into object3D - AFTER MindAR already
    // wrote its raw value, so ours is what actually gets rendered.
    AFRAME.registerComponent('persist-model', {
      schema: {
        smoothness: { type: 'number', default: 0.15 } // lower = smoother but laggier, higher = snappier but shakier
      },

      init: function() {
        this.isTracking = false;
        this.hasSmoothed = false;

        this.smoothedPosition = new THREE.Vector3();
        this.smoothedQuaternion = new THREE.Quaternion();

        this.frozenPosition = new THREE.Vector3();
        this.frozenQuaternion = new THREE.Quaternion();
        this.hasFrozen = false;

        this.onTargetFound = () => {
          this.isTracking = true;
        };

        this.onTargetLost = () => {
          this.isTracking = false;
          // Freeze at whatever our last SMOOTHED transform was (not the
          // raw jittery one) so it doesn't snap to a noisy value on loss.
          this.frozenPosition.copy(this.smoothedPosition);
          this.frozenQuaternion.copy(this.smoothedQuaternion);
          this.hasFrozen = true;
        };

        this.el.addEventListener('targetFound', this.onTargetFound);
        this.el.addEventListener('targetLost', this.onTargetLost);
      },

      tick: function() {
        const obj = this.el.object3D;

        // Always force visible - fixes the disappearing-model bug.
        obj.visible = true;

        if (this.isTracking) {
          // obj.position/quaternion currently hold MindAR's fresh raw
          // estimate for this frame (written before this tick ran).
          if (!this.hasSmoothed) {
            // First tracked frame - snap directly, nothing to blend yet.
            this.smoothedPosition.copy(obj.position);
            this.smoothedQuaternion.copy(obj.quaternion);
            this.hasSmoothed = true;
          } else {
            const alpha = this.data.smoothness;
            this.smoothedPosition.lerp(obj.position, alpha);
            this.smoothedQuaternion.slerp(obj.quaternion, alpha);
          }

          obj.position.copy(this.smoothedPosition);
          obj.quaternion.copy(this.smoothedQuaternion);
        } else if (this.hasFrozen) {
          // Target out of view - hold at the last smoothed transform.
          obj.position.copy(this.frozenPosition);
          obj.quaternion.copy(this.frozenQuaternion);
        }
      },

      remove: function() {
        this.el.removeEventListener('targetFound', this.onTargetFound);
        this.el.removeEventListener('targetLost', this.onTargetLost);
      }
    });

    // ============================================================
    // COMPONENT 5: Fill-Screen Scale
    // ============================================================
    // GOAL: no matter how close or far you are from the target when you
    // FIRST scan it, the model should appear filling almost the full
    // WIDTH of the phone screen. After that, moving the camera closer or
    // farther should behave like approaching a real object - it gets
    // bigger/smaller naturally (normal AR perspective), NOT re-fit to
    // the screen every frame.
    //
    // How: measure distance from camera to target at the moment of first
    // detection, compute the visible WIDTH (not height) of the camera
    // frustum at that distance using the camera's aspect ratio, then
    // scale the model so its native width matches ~90% of that. This
    // scale is calculated ONCE and locked - everything after that is
    // governed by normal perspective as you move, exactly like a real
    // physical object would behave.
    AFRAME.registerComponent('fill-screen-scale', {
      schema: {
        screenFill: { type: 'number', default: 0.9 } // 0.9 = ~90% of screen width
      },

      init: function() {
        this.nativeSize = null;   // model's raw bounding box size, unscaled
        this.scaled = false;      // becomes true once we've locked in a scale
        this.isTracking = false;  // tracked independently - object3D.visible
                                   // is forced true permanently by persist-model,
                                   // so it can't be used to detect real tracking
        this.targetEntity = this.el.closest('[mindar-image-target]');

        if (this.targetEntity) {
          this.targetEntity.addEventListener('targetFound', () => {
            this.isTracking = true;
          });
        }

        this.el.addEventListener('model-loaded', () => {
          try {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            // Reset scale to 1 first so the bounding box we measure is
            // in true native/local units, unaffected by any prior scale.
            this.el.object3D.scale.set(1, 1, 1);

            const box = new THREE.Box3().setFromObject(mesh);
            this.nativeSize = box.getSize(new THREE.Vector3());
          } catch (e) {
            console.error('fill-screen-scale: failed to measure model', e);
          }
        });
      },

      tick: function() {
        if (this.scaled || !this.nativeSize || !this.targetEntity) return;
        if (!this.isTracking) return; // wait for a real (live) detection

        // Use A-Frame's own reference to the camera actually being used
        // for rendering (sceneEl.camera), rather than looking up the
        // <a-camera> entity's object3D by hand. This guarantees we're
        // reading the exact camera MindAR is driving, not a stale or
        // mismatched reference.
        const sceneEl = document.querySelector('a-scene');
        const camObj = sceneEl && sceneEl.camera;
        if (!camObj) return;

        const camPos = new THREE.Vector3();
        const targetPos = new THREE.Vector3();
        camObj.getWorldPosition(camPos);
        this.targetEntity.object3D.getWorldPosition(targetPos);

        const distance = camPos.distanceTo(targetPos);
        if (distance <= 0.001) return;

        // IMPORTANT: MindAR overrides this camera's projectionMatrix
        // directly with values calibrated to the actual phone camera/
        // video feed - it does NOT necessarily keep camObj.fov / .aspect
        // in sync with that. Reading fov/aspect here was giving us a
        // frustum size that didn't match what MindAR is really using,
        // which is why the model wasn't actually filling the screen.
        //
        // Fix: read the frustum size straight out of the real, active
        // projection matrix. For a standard perspective matrix (column-
        // major, three.js layout), elements[0] and elements[5] directly
        // encode 2*near/width and 2*near/height of the near plane - and
        // since the frustum is a straight cone from the camera, the
        // visible width/height at ANY distance d scales linearly:
        //   visibleWidth  = d * (2 / elements[0])
        //   visibleHeight = d * (2 / elements[5])
        // This works correctly no matter what fov/aspect MindAR set.
        const pm = camObj.projectionMatrix.elements;
        if (!pm[0] || !pm[5]) return; // not initialized yet, try again next frame

        const visibleWidth = distance * (2 / Math.abs(pm[0]));
        const desiredWidth = visibleWidth * this.data.screenFill;

        // Use the LARGEST dimension across all 3 axes, not just .x.
        // Why: after a GLB import, a model's "true" left-right width
        // isn't guaranteed to sit on the local X axis - it depends on
        // how the model was authored/exported. If width actually ended
        // up on Z (depth) instead, using nativeSize.x alone would give
        // a tiny, wrong number and the model would end up far smaller
        // than intended. Using the max of x/y/z is a safe, orientation-
        // independent way to make sure the model's biggest visible side
        // ends up close to the target screen-fill size.
        const nativeSizeMax = Math.max(
          this.nativeSize.x,
          this.nativeSize.y,
          this.nativeSize.z,
          0.001
        );
        const scale = desiredWidth / nativeSizeMax;

        // Sanity check - if projectionMatrix wasn't fully ready yet this
        // could produce garbage (NaN/Infinity/negative). Skip and retry
        // next frame instead of locking in a broken scale.
        if (!isFinite(scale) || scale <= 0) return;

        this.el.object3D.scale.set(scale, scale, scale);
        this.scaled = true; // lock it in - moving closer/farther now behaves naturally

        const debugMsg = `Scale ${scale.toFixed(2)}x | dist ${distance.toFixed(2)}m | model xyz: ${this.nativeSize.x.toFixed(2)},${this.nativeSize.y.toFixed(2)},${this.nativeSize.z.toFixed(2)}`;
        console.log(`✅ Fill-screen scale locked: ${debugMsg}`);

        // Temporary on-screen readout so you can verify this on your phone
        // without needing to plug into remote DevTools. Safe to remove once
        // sizing looks right - just delete this if-block.
        if (typeof updateStatus === 'function') {
          updateStatus(debugMsg);
          setTimeout(() => {
            if (typeof updateStatus === 'function') updateStatus('Ready');
          }, 6000);
        }
      }
    });
  </script>
</head>

<body>

<div id="loading">
  Loading AR Menu...
</div>

<div id="simple-text">
  Scan a menu item target image
</div>

<div id="status">
  Initializing...
</div>

<!-- Main A-Frame Scene -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4;"
  color-space="sRGB"
  renderer="alpha: true; colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
  embedded
  id="ar-scene"
>

  <!-- All assets loaded here dynamically -->
  <a-assets id="model-assets"></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- All target entities generated here dynamically -->
  <div id="targets-container"></div>

</a-scene>

<script>
  // ============================================================
  // MULTI-TARGET MAPPING
  // ============================================================
  // Map targetIndex (from targets.mind) to model name
  // 
  // targets.mind structure (generated from your target images):
  // - Target Index 0: first image uploaded
  // - Target Index 1: second image uploaded
  // - Target Index 2: third image uploaded
  // - etc.
  //
  // When generating targets.mind, make note of the order you uploaded images
  // Then create this mapping accordingly
  //
  // Example:
  // Uploaded pizza.jpg first → Index 0 → 'pizza'
  // Uploaded burger.jpg second → Index 1 → 'burger'
  // Uploaded salad.jpg third → Index 2 → 'salad'
  //

  const TARGET_MAPPING = {
    0: 'burger',           // Target Image 0 → burger.glb
    1: 'pizza',            // Target Image 1 → pizza.glb
    // Add more mappings as needed - up to 30+
    // 2: 'salad',
    // 3: 'pasta',
    // ... etc
  };

  // ============================================================
  // DYNAMIC ENTITY GENERATION
  // ============================================================

  let loadedModels = 0;
  const totalModels = Object.keys(TARGET_MAPPING).length;
  let currentlyTrackedTarget = null;

  function updateStatus(message) {
    const statusEl = document.getElementById('status');
    if (statusEl) {
      statusEl.textContent = message;
    }
  }

  function createTargetEntities() {
    const assetsContainer = document.getElementById('model-assets');
    const scene = document.getElementById('ar-scene');
    
    console.log(`Creating ${totalModels} target entities...`);
    updateStatus(`Loading ${totalModels} models...`);

    Object.entries(TARGET_MAPPING).forEach(([targetIndex, modelName]) => {
      console.log(`  [${targetIndex}] → ${modelName}.glb`);

      // ===== CREATE ASSET =====
      const asset = document.createElement('a-asset-item');
      asset.id = `model-${modelName}`;
      asset.setAttribute('src', `./models/${modelName}.glb`);
      asset.setAttribute('crossorigin', 'anonymous');
      
      // Track when model loads
      asset.addEventListener('load', () => {
        loadedModels++;
        const progress = Math.round((loadedModels / totalModels) * 100);
        updateStatus(`Loading: ${progress}%`);
        console.log(`✅ Loaded ${modelName} (${loadedModels}/${totalModels})`);

        if (loadedModels === totalModels) {
          updateStatus('Ready - Scan item');
          document.getElementById('loading').style.display = 'none';
        }
      });

      asset.addEventListener('error', () => {
        console.error(`❌ Failed to load ${modelName}`);
        updateStatus(`Error loading: ${modelName}`);
      });

      assetsContainer.appendChild(asset);

      // ===== CREATE TARGET ENTITY =====
      const targetEntity = document.createElement('a-entity');
      targetEntity.id = `target-${targetIndex}`;
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${targetIndex}`);
      targetEntity.setAttribute('persist-model', 'smoothness: 0.15'); // real EMA smoothing + freeze-on-lost, both in one component now

      // Track when target is found/lost
      scene.addEventListener('targetFound', (event) => {
        if (event.detail.targetIndex === parseInt(targetIndex)) {
          currentlyTrackedTarget = modelName;
          updateStatus(`Showing: ${modelName.toUpperCase()}`);
          console.log(`🎯 Target found: ${modelName}`);
        }
      });

      scene.addEventListener('targetLost', (event) => {
        if (event.detail.targetIndex === parseInt(targetIndex)) {
          updateStatus('Scan item');
          console.log(`⏸ Target lost: ${modelName}`);
        }
      });

      // ===== POSITION & ROTATION WRAPPER =====
      // No artificial tilt here. The target plane itself already faces
      // the camera at whatever angle you're physically holding the phone
      // at - a vertical monitor gives a face-on view, a flat printed
      // target on a table naturally gives a top-down view, simply because
      // of how you're holding the camera relative to it. Baking in a
      // fixed "-45 0 0" tilt fought against that and looked wrong on
      // anything but one specific physical setup.
      //
      // NOTE: if your pizza.glb (and other models) were modeled "standing
      // up" (Y-up, like a character), they may need a base correction so
      // they lie flat on the target plane instead of standing on edge.
      // Try these values on the wrapper's rotation if models look wrong:
      //   '0 0 0'    - use as-is (try this first)
      //   '-90 0 0'  - lay a Y-up model flat, facing up
      //   '90 0 0'   - lay a Y-up model flat, facing down
      const positionWrapper = document.createElement('a-entity');
      positionWrapper.setAttribute('position', '0 0 0.3');
      positionWrapper.setAttribute('rotation', '0 0 0');

      // ===== 3D MODEL =====
      const model = document.createElement('a-gltf-model');
      model.id = `model-mesh-${targetIndex}`;
      model.setAttribute('pinch-scale', '');            // Enable pinch zoom
      model.setAttribute('drag-rotate', '');             // Enable drag rotation (X + Y axis)
      model.setAttribute('fill-screen-scale', 'screenFill: 0.9'); // Fills ~90% of screen WIDTH on first scan, any distance
      model.setAttribute('src', `#model-${modelName}`);
      model.setAttribute('position', '0 0 0');
      model.setAttribute('rotation', '0 0 0');
      model.setAttribute('scale', '1 1 1');

      // Track model loading
      model.addEventListener('model-loaded', () => {
        console.log(`  └─ Model mesh loaded: ${modelName}`);
      });

      model.addEventListener('error', () => {
        console.error(`  └─ Model mesh error: ${modelName}`);
      });

      // ===== MODEL NAME LABEL =====
      const label = document.createElement('a-text');
      label.setAttribute('value', modelName.toUpperCase());
      label.setAttribute('position', '0 -1.2 0');
      label.setAttribute('scale', '0.5 0.5 0.5');
      label.setAttribute('color', 'white');
      label.setAttribute('align', 'center');
      label.setAttribute('anchor', 'center');

      // ===== ASSEMBLE HIERARCHY =====
      positionWrapper.appendChild(model);
      positionWrapper.appendChild(label);
      targetEntity.appendChild(positionWrapper);

      // Add to scene
      scene.appendChild(targetEntity);
    });

    console.log(`✅ Created ${totalModels} target entities`);
  }

  // ============================================================
  // INITIALIZATION
  // ============================================================

  document.addEventListener('DOMContentLoaded', () => {
    console.log('=== Restaurant AR Menu Initializing ===');
    console.log(`Total models to load: ${totalModels}`);
    
    const scene = document.getElementById('ar-scene');

    // Wait for A-Frame scene to load
    scene.addEventListener('loaded', () => {
      console.log('✅ A-Frame scene loaded');
      createTargetEntities();
    });

    // AR system ready
    scene.addEventListener('arReady', () => {
      console.log('✅ AR system ready - camera should be visible');
    });

    // AR errors
    scene.addEventListener('arError', (event) => {
      console.error('❌ AR Error:', event.detail);
      updateStatus(`AR Error: ${event.detail.error}`);
    });

    // Timeout fallback
    setTimeout(() => {
      if (document.getElementById('loading').style.display !== 'none') {
        console.warn('⚠️ Loading timeout');
        document.getElementById('loading').style.display = 'none';
        updateStatus('Scan item');
      }
    }, 8000);
  });

  // ============================================================
  // UTILITY: Show current tracking info
  // ============================================================
  window.getARStatus = function() {
    console.log(`Currently tracked: ${currentlyTrackedTarget || 'None'}`);
    console.log(`Loaded models: ${loadedModels}/${totalModels}`);
    return {
      currentModel: currentlyTrackedTarget,
      loadedModels: loadedModels,
      totalModels: totalModels
    };
  };
</script>

</body>
</html>
