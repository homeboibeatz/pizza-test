<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pizza AR Diagnostic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        a-scene { width: 100% !important; height: 100% !important; }
        .mindar-ui-overlay { display: none !important; }

        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            color: #fff; text-align: center; padding: 20px; background: rgba(0,0,0,0.85);
        }
        .btn { padding: 14px 32px; background: #ff6b35; color: #fff; border: none; border-radius: 50px; font-size: 17px; cursor: pointer; margin-top: 20px; }
        
        /* Diagnostic Log Screen */
        #log-screen {
            position: fixed; bottom: 0; left: 0; right: 0; height: 40%;
            background: rgba(0,0,0,0.9); color: #0f0; padding: 15px;
            font-size: 12px; overflow-y: auto; z-index: 500; display: none;
            border-top: 2px solid #ff6b35; white-space: pre-wrap; word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h2>🍕 Pizza AR Menu</h2>
        <p id="status-text">Checking browser compatibility...</p>
        <button id="start-btn" class="btn" style="display:none;">Start AR Camera</button>
    </div>

    <div id="log-screen" id="log"></div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
        renderer="antialias: true; colorManagement: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        style="width: 100%; height: 100%;">

        <a-assets>
            <a-asset-item id="pizza-model-asset" src="pizza.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity id="model-container" rotation="0 0 0" scale="1 1 1">
                <a-gltf-model id="pizzaModel" src="#pizza-model-asset" position="0 0 0" scale="1 1 1"></a-gltf-model>
            </a-entity>
        </a-entity>
    </a-scene>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        // 1. Setup Diagnostic Logger
        const logScreen = document.getElementById('log-screen');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        function log(msg) {
            console.log(msg);
            logScreen.style.display = 'block';
            logScreen.innerHTML += msg + '\n';
            logScreen.scrollTop = logScreen.scrollHeight;
        }

        log("1. Script loaded. Checking environment...");

        // 2. Check Secure Context (HTTPS / Localhost)
        if (!window.isSecureContext) {
            log("\n❌ FATAL ERROR: NOT A SECURE CONTEXT!");
            log("You are opening this via HTTP on a phone (e.g., http://192.168.x.x).");
            log("Browsers block the camera unless you use 'http://localhost' OR 'https://'.");
            statusText.innerText = "❌ HTTPS Required for Mobile Camera. Check log at bottom.";
        } else {
            log("✅ Secure context verified (HTTPS or localhost).");
            statusText.innerText = "Ready to start.";
            startBtn.style.display = 'block';
        }

        const sceneEl = document.querySelector('a-scene');

        // 3. Wait for A-Frame to fully load
        sceneEl.addEventListener('loaded', () => {
            log("2. A-Frame scene has fully loaded.");
            
            // Check if MindAR registered
            if (typeof AFRAME !== 'undefined' && AFRAME.systems && AFRAME.systems['mindar-image-system']) {
                log("✅ MindAR system registered successfully.");
            } else {
                log("❌ ERROR: MindAR system NOT found. CDN script failed to load.");
            }
        });

        // 4. Start Button Logic
        startBtn.addEventListener('click', async () => {
            log("3. Start button clicked.");
            overlay.style.display = 'none';
            
            // Wait a moment to ensure DOM is ready
            await new Promise(r => setTimeout(r, 200));

            // Try to find the system
            let arSystem = sceneEl.systems['mindar-image-system'];
            
            if (!arSystem) {
                log("❌ Could not find mindar-image-system on scene. Trying again...");
                await new Promise(r => setTimeout(r, 500));
                arSystem = sceneEl.systems['mindar-image-system'];
            }

            if (arSystem) {
                log("4. Calling arSystem.start()...");
                try {
                    await arSystem.start();
                    log("5. arSystem.start() resolved successfully.");
                } catch (e) {
                    log("❌ arSystem.start() threw an error: " + e.message);
                    overlay.style.display = 'flex';
                }
            } else {
                log("❌ FATAL: MindAR system is completely missing. Cannot start.");
                overlay.style.display = 'flex';
                statusText.innerText = "MindAR failed to load. Check internet connection.";
            }
        });

        // 5. AR Event Listeners
        sceneEl.addEventListener('arReady', () => {
            log("6. 🎉 arReady event fired! Camera should be visible now.");
        });

        sceneEl.addEventListener('arError', (event) => {
            log("❌ arError event fired: " + JSON.stringify(event.detail));
        });

        const targetEl = document.querySelector('[mindar-image-target]');
        targetEl.addEventListener('targetFound', () => {
            log("7. 🍕 Target Found! Model should be visible.");
            
            // Auto-center and scale the model
            const modelEl = document.getElementById('pizzaModel');
            const model = modelEl.getObject3D('mesh');
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                model.traverse((o) => {
                    if (o.isMesh && o.geometry) {
                        o.geometry.translate(-center.x, -center.y, -center.z);
                    }
                });

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 1.5 / maxDim;
                    document.getElementById('model-container').setAttribute('scale', `${scale} ${scale} ${scale}`);
                }
            }
        });

        targetEl.addEventListener('targetLost', () => {
            log("Target lost.");
        });

        // 6. Simple Touch Controls
        let currentRotation = 0, currentScale = 1.0, baseScale = 1.0, isDragging = false, lastX = 0, lastTouchDist = 0;
        const modelContainer = document.getElementById('model-container');

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
                baseScale = currentScale;
            } else if (e.touches.length === 1) {
                isDragging = true; lastX = e.touches[0].clientX;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                currentScale = Math.max(0.1, Math.min(5.0, baseScale + (dist - lastTouchDist) * 0.01));
                modelContainer.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
            } else if (e.touches.length === 1 && isDragging) {
                e.preventDefault();
                currentRotation += (e.touches[0].clientX - lastX) * 0.5;
                modelContainer.setAttribute('rotation', `0 ${currentRotation} 0`);
                lastX = e.touches[0].clientX;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => { isDragging = false; });
    </script>
</body>
</html>
