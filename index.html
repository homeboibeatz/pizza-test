<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pizza AR Menu</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; background: #000; position: fixed;
      top: 0; left: 0; touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #ar-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }

    #ar-container .a-canvas, 
    #ar-container video {
      width: 100% !important; height: 100% !important;
      max-width: 100% !important; max-height: 100% !important;
      position: absolute !important; top: 0 !important; left: 0 !important;
      object-fit: cover !important;
    }

    #loading {
      position: fixed; inset: 0; background: #000; color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; padding: 20px; text-align: center;
    }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #ff6b35; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #controls-ui {
      position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 18px 22px; color: #fff; z-index: 150;
      font-size: 14px; max-width: 260px; pointer-events: none;
      display: none;
    }
    .instruction { color: rgba(255,255,255,0.75); margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2 id="loading-text">Downloading 3D Model...</h2>
    <p style="font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 10px;">Please allow camera access when prompted.</p>
  </div>

  <div id="controls-ui">
    <div style="font-weight: bold; margin-bottom: 10px;">🍕 AR Pizza Menu</div>
    <div class="instruction">📷 Point at target image</div>
    <div class="instruction">👆 Drag to rotate</div>
    <div class="instruction">✌️ Pinch to scale</div>
  </div>

  <div id="ar-container">
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; maxTrack: 4;"
      color-space="sRGB"
      renderer="antialias: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
      embedded>

      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="model-container" rotation="0 0 0" scale="1 1 1">
          <!-- Model src is set dynamically by JS after Cache fetch -->
          <a-gltf-model id="pizzaModel" src="" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>
  </div>

  <script>
    // =========================================================
    // 1. BULLETPROOF CAMERA CONSTRAINT INTERCEPTOR
    // =========================================================
    const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = async function(constraints) {
      console.log("Intercepted getUserMedia:", JSON.stringify(constraints));
      try {
        // Try original constraints first
        return await originalGetUserMedia(constraints);
      } catch (err) {
        console.warn("Camera failed with original constraints. Falling back to generic video.");
        // If it fails (OverconstrainedError), strip all constraints and just ask for video: true
        return await originalGetUserMedia({ video: true, audio: false });
      }
    };

    // =========================================================
    // 2. MODEL CACHING LOGIC (Cache API)
    // =========================================================
    const MODEL_URL = 'pizza.glb';
    const CACHE_NAME = 'pizza-ar-cache-v1';
    const loadingText = document.getElementById('loading-text');

    async function loadModelWithCache() {
      try {
        const cache = await caches.open(CACHE_NAME);
        let cachedResponse = await cache.match(MODEL_URL);

        if (cachedResponse) {
          console.log("Model loaded from device cache!");
          loadingText.innerText = "Loading model from cache...";
        } else {
          console.log("Downloading model for the first time...");
          loadingText.innerText = "Downloading 3D Model...";
          // Fetch it from network
          const networkResponse = await fetch(MODEL_URL);
          if (!networkResponse.ok) throw new Error("Network response was not ok.");
          // Save to cache
          await cache.put(MODEL_URL, networkResponse.clone());
          cachedResponse = networkResponse;
        }

        const blob = await cachedResponse.blob();
        const blobURL = URL.createObjectURL(blob);
        
        // Apply to A-Frame
        document.getElementById('pizzaModel').setAttribute('src', blobURL);
        console.log("Model applied to scene.");

      } catch (error) {
        console.error("Cache/Load failed:", error);
        // Fallback to direct URL if caching fails
        document.getElementById('pizzaModel').setAttribute('src', MODEL_URL);
      }
    }

    // Start downloading/caching immediately
    loadModelWithCache();

    // =========================================================
    // 3. SCENE LOGIC & MODEL SCALING FIX
    // =========================================================
    const sceneEl = document.querySelector('a-scene');
    const loadingOverlay = document.getElementById('loading');
    const controlsUI = document.getElementById('controls-ui');
    const modelContainer = document.getElementById('model-container');

    let currentRotation = 0, currentScale = 1.0, baseScale = 1.0, isDragging = false, lastX = 0, lastTouchDist = 0;

    sceneEl.addEventListener('loaded', () => {
      loadingOverlay.style.display = 'none';
    });

    sceneEl.addEventListener('arReady', () => {
      console.log('AR is ready, camera is streaming!');
      controlsUI.style.display = 'block';
    });

    sceneEl.addEventListener('arError', (event) => {
      console.error('AR Error:', event.detail);
      loadingOverlay.style.display = 'flex';
      loadingOverlay.innerHTML = '<h2>⚠️ Camera Error</h2><p style="margin-top:10px;">Could not access the camera. Please ensure no other app is using it, and that you are using HTTPS.</p>';
    });

    const targetEl = document.querySelector('[mindar-image-target]');
    targetEl.addEventListener('targetFound', () => {
      console.log('Target found!');
      
      const modelEl = document.getElementById('pizzaModel');
      const model = modelEl.getObject3D('mesh');
      
      if (model) {
        console.log('Model mesh found! Sizing...');
        
        // FIX: Force geometry to compute bounding box (fixes 'Missing min/max' warning)
        model.traverse((o) => {
          if (o.isMesh && o.geometry) {
            if (!o.geometry.boundingBox) {
              o.geometry.computeBoundingBox();
            }
          }
        });

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        // Center geometry
        model.traverse((o) => {
          if (o.isMesh && o.geometry) {
            o.geometry.translate(-center.x, -center.y, -center.z);
          }
        });

        const maxDim = Math.max(size.x, size.y, size.z);
        let scale = 0.5; // Fallback scale
        if (maxDim > 0 && isFinite(maxDim)) {
          scale = 1.5 / maxDim; // Fit to 1.5 units
        }

        modelContainer.setAttribute('scale', `${scale} ${scale} ${scale}`);
        currentScale = scale;
        baseScale = scale;
        console.log(`Model scaled to ${scale}`);
      } else {
        console.warn('Target found, but 3D model is still loading...');
      }
    });

    targetEl.addEventListener('targetLost', () => {
      console.log('Target lost');
    });

    // =========================================================
    // 4. TOUCH CONTROLS
    // =========================================================
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDist = Math.sqrt(dx * dx + dy * dy);
        baseScale = currentScale;
      } else if (e.touches.length === 1) {
        isDragging = true; 
        lastX = e.touches[0].clientX;
      }
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        currentScale = Math.max(0.1, Math.min(5.0, baseScale + (dist - lastTouchDist) * 0.01));
        modelContainer.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
      } else if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        currentRotation += (e.touches[0].clientX - lastX) * 0.5;
        modelContainer.setAttribute('rotation', `0 ${currentRotation} 0`);
        lastX = e.touches[0].clientX;
      }
    }, { passive: false });

    document.addEventListener('touchend', () => { isDragging = false; });
  </script>
</body>
</html>
