<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Pizza AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* FIX: Added height: 100% so the embedded scene fills the phone screen */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }
  </style>

  <script>
    // 1. Pinch to Scale Component
    AFRAME.registerComponent("pinch-scale", {
      init: function () {
        const el = this.el;

        let startDistance = 0;
        let startScale = el.object3D.scale.x;

        const getDistance = (touches) => {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        };

        window.addEventListener(
          "touchmove",
          (e) => {
            if (e.touches.length !== 2) return;

            e.preventDefault();

            const distance = getDistance(e.touches);

            if (!startDistance) {
              startDistance = distance;
              startScale = el.object3D.scale.x;
              return;
            }

            const scale = startScale * (distance / startDistance);

            const clampedScale = Math.max(
              0.5,
              Math.min(scale, 20)
            );

            el.object3D.scale.set(
              clampedScale,
              clampedScale,
              clampedScale
            );
          },
          { passive: false }
        );

        window.addEventListener("touchend", () => {
          startDistance = 0;
        });
      }
    });

    // 2. Drag to Rotate Component
    AFRAME.registerComponent("drag-rotate", {
      init: function () {
        const el = this.el;
        
        let isDragging = false;
        let lastX = 0;

        window.addEventListener("touchstart", (e) => {
          // Only start dragging if exactly 1 finger is on the screen
          if (e.touches.length === 1) {
            isDragging = true;
            lastX = e.touches[0].clientX;
          }
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          // Only rotate if dragging with 1 finger (ignores 2-finger pinch)
          if (e.touches.length !== 1 || !isDragging) return;

          e.preventDefault();

          const currentX = e.touches[0].clientX;
          const deltaX = currentX - lastX;

          // Rotate around Y axis. Change 0.01 to make it faster/slower
          el.object3D.rotation.y += deltaX * 0.01;

          lastX = currentX;
        }, { passive: false });

        window.addEventListener("touchend", () => {
          isDragging = false;
        });
      }
    });
  </script>
</head>

<body>

<div id="loading">
  Loading AR Experience...
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
  embedded
  style="width: 100%; height: 100%;"
>

  <a-assets>
    <a-asset-item
      id="pizzaModel"
      src="./pizza.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      id="pizza"
      pinch-scale
      drag-rotate
      src="#pizzaModel"
      position="0 0 0"
      rotation="0 0 0"
      scale="3 3 3">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
      document.getElementById("loading").style.display = "none";
    });
  });
</script>

</body>
</html>
